<style>
/* Layout: app de una columna para el móvil, cabecera fija arriba, barra de secciones abajo, hojas que suben para editar. */
:root{
  --bg:#F0F2F5; --surface:#FFFFFF; --surface-2:#E9EDF2; --ink:#1C1E21; --muted:#5F6670; --line:#DADDE1;
  --pine:#1877C9; --pine-ink:#FFFFFF; --pine-soft:#E4F0FC; --signal:#D93A26;
  --warn:#9A5B00; --warn-soft:#FDF0D8; --ok:#1E8A4C; --ok-soft:#DFF3E7; --bad:#C0331F; --bad-soft:#FBE3DE;
  --top-bg:#FFFFFF; --top-ink:#1C1E21;
  --c-red:#E5484D; --c-blue:#1877C9; --c-green:#2DA05A; --c-orange:#F08C00; --c-purple:#7B5BD6;
  --scrim:rgba(10,15,25,.45);
  --paper:#FFFFFF; --paper-ink:#262626; --paper-muted:#6B6B6B; --paper-band:#8EA0EA; --paper-blue:#1F43B5; --paper-line:#DADADA;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
  --f-paper:Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121417; --surface:#1C1F23; --surface-2:#262A30; --ink:#E7E9EC; --muted:#A2A8B0; --line:#30353C;
  --pine:#4A9FE8; --pine-ink:#08111B; --pine-soft:#1A2B3D; --signal:#FF6B57;
  --warn:#F0B44E; --warn-soft:#3A2D12; --ok:#5BD08A; --ok-soft:#14301F; --bad:#FF8A75; --bad-soft:#3A1C16;
  --top-bg:#1C1F23; --top-ink:#E7E9EC;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1C1F23; --surface-2:#262A30; --ink:#E7E9EC; --muted:#A2A8B0; --line:#30353C;
  --pine:#4A9FE8; --pine-ink:#08111B; --pine-soft:#1A2B3D; --signal:#FF6B57;
  --warn:#F0B44E; --warn-soft:#3A2D12; --ok:#5BD08A; --ok-soft:#14301F; --bad:#FF8A75; --bad-soft:#3A1C16;
  --top-bg:#1C1F23; --top-ink:#E7E9EC;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--top-bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--top-bg);color:var(--top-ink);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.top img{width:42px;height:42px;border-radius:50%;display:block;border:2px solid var(--line)}
.brand{flex:1;min-width:0}
.brand b{display:block;font-family:var(--f-display);font-size:21px;line-height:1;letter-spacing:.02em}
.brand span{font-size:13px;color:var(--muted)}
.icon-btn{background:var(--surface-2);border:0;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.icon-btn svg{width:22px;height:22px}

main{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.bottom-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav{background:none;border:0;border-radius:12px;padding:6px 2px;display:grid;justify-items:center;gap:2px;font-size:12px;color:var(--muted);cursor:pointer;font-weight:600}
.nav svg{width:24px;height:24px}
.nav.on{color:var(--pine);background:var(--pine-soft)}
.nav:focus-visible{outline:2px solid var(--pine)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.card h2{font-size:22px}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sec-title h1{font-size:30px}
.muted{color:var(--muted)}
.small{font-size:14px}
.notice{border-radius:12px;padding:12px 14px;background:var(--warn-soft);color:var(--warn);font-size:15px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--pine);color:var(--pine-ink);border-color:var(--pine)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{min-height:38px;padding:7px 12px;font-size:15px}
.btn:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.btn svg{width:20px;height:20px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row>.btn{flex:1 1 140px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:460px){.grid2.stack{grid-template-columns:1fr}}

label.f{display:grid;gap:6px;font-size:14px;font-weight:600;color:var(--muted);min-width:0}
.inp{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--ink);font-weight:500}
textarea.inp{min-height:84px;resize:vertical;line-height:1.35}
.inp:focus{outline:2px solid var(--pine);outline-offset:0;border-color:var(--pine)}
.check{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--pine)}

.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 6px;font-weight:600;cursor:pointer;color:var(--muted);font-size:15px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}

.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tool{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;display:grid;gap:2px}
.tool b{font-size:15px}
.tool span{font-size:13px;color:var(--muted)}
.tool.on{border-color:var(--pine);background:var(--pine-soft)}

.zone{border:1px dashed var(--line);border-radius:12px;padding:12px;display:grid;gap:12px}
.zone-h{display:flex;justify-content:space-between;align-items:center}
.zone-h h3{font-size:19px}

.result{background:linear-gradient(135deg,var(--pine),#0E5AA7);color:#fff;border-radius:16px;padding:18px;display:grid;gap:12px}
.result .big{font-family:var(--f-display);font-size:46px;line-height:1;font-weight:700}
.result .sub{opacity:.85;font-size:15px}
.result .kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result .kv div{background:rgba(255,255,255,.12);border-radius:10px;padding:10px}
.result .kv small{display:block;opacity:.8;font-size:13px}
.result .kv b{font-size:20px}
.result ul{margin:0;padding-left:18px;font-size:14px;opacity:.92;display:grid;gap:3px}
.result .btn{background:#fff;color:#0E5AA7;border-color:transparent}
.result .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .result .kv div{background:rgba(0,0,0,.12)}}
:root[data-theme="dark"] .result .kv div{background:rgba(0,0,0,.12)}

.hero{position:relative;border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.hero-img{height:150px;background:#333 center/cover no-repeat}
.hero-body{padding:0 16px 16px;display:flex;gap:14px;align-items:flex-end;margin-top:-44px;position:relative}
.hero-logo{width:92px;height:92px;border-radius:50%;border:4px solid var(--surface);background:var(--surface);flex:none;object-fit:cover}
.hero-txt{min-width:0;padding-top:52px}
.hero-txt h1{font-size:28px;line-height:1.05}
.hero-txt span{font-size:14px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 4px;display:grid;justify-items:center;gap:6px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink);text-align:center}
.qa i{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff}
.qa i svg{width:24px;height:24px}
.qa:focus-visible{outline:2px solid var(--pine)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:2px;cursor:pointer;text-align:left}
.stat small{font-size:13px;color:var(--muted);font-weight:600}
.stat b{font-family:var(--f-display);font-size:28px;line-height:1.05;color:var(--pine)}
.stat span{font-size:13px;color:var(--muted)}
@media (max-width:420px){.stat b{font-size:23px}}

.list{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;width:100%}
.item:focus-visible{outline:2px solid var(--pine)}
.item .main{flex:1;min-width:0;display:grid;gap:2px}
.item .main b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .main span{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .side{text-align:right;display:grid;gap:4px;justify-items:end}
.item .side b{font-size:16px}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.p-pend{background:var(--warn-soft);color:var(--warn)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--pine-soft);color:var(--pine)}
.tag{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}

.line-ed{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;background:var(--bg)}
.line-ed .grid4{display:grid;grid-template-columns:1fr 1.3fr 1fr 1fr auto;gap:8px;align-items:end}
@media (max-width:460px){.line-ed .grid4{grid-template-columns:1fr 1fr 1fr;}}
.tot{display:grid;gap:4px;font-size:15px}
.tot div{display:flex;justify-content:space-between;gap:12px}
.tot .grand{font-weight:700;font-size:19px;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}

.sheet-wrap{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:820px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);overflow:auto;border-radius:18px 18px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start}
.sheet-h{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px 8px;border-bottom:1px solid var(--line)}
.sheet-h h2{flex:1;font-size:24px;min-width:0}
.close{background:var(--surface-2);border:0;border-radius:10px;width:40px;height:40px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.close svg{width:20px;height:20px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;max-width:calc(100% - 32px)}

/* Documento (papel): mismo aspecto en claro y oscuro */
.paper-box{background:var(--surface-2);border-radius:12px;padding:10px;overflow:hidden}
.paper{width:794px;min-height:1123px;background:var(--paper);color:var(--paper-ink);font-family:var(--f-paper);font-size:14px;line-height:1.45;padding:56px 64px 48px;display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.paper b{font-weight:700}
.p-head{display:flex;justify-content:space-between;gap:24px}
.p-logo{width:200px;height:200px;object-fit:cover}
.p-emisor{text-align:right;color:var(--paper-muted);font-size:14px}
.p-emisor .p-title{font-size:28px;letter-spacing:.06em;color:var(--paper-ink);margin-bottom:28px;font-weight:400}
.p-emisor .p-name{color:var(--paper-ink);font-weight:700}
.p-emisor .p-gap{height:18px}
.p-meta{display:flex;justify-content:space-between;gap:24px;margin-top:40px}
.p-para{font-size:14px;line-height:1.75;padding-left:8px}
.p-lbl{font-size:12px;font-weight:700;letter-spacing:.04em}
.p-kv{border-collapse:collapse;font-size:14px;line-height:1.75;min-width:290px}
.p-kv td{padding:0}
.p-kv td:last-child{text-align:right;font-weight:700;padding-left:30px}
.p-lines{width:100%;border-collapse:collapse;margin-top:40px;font-size:14px}
.p-lines th{background:var(--paper-band);color:#1E2440;font-weight:700;font-size:13px;text-align:right;padding:12px 10px;border-right:1px solid rgba(255,255,255,.55)}
.p-lines th:first-child{text-align:left;padding-left:16px}
.p-lines th:last-child{border-right:0}
.p-lines td{padding:12px 10px;text-align:right;vertical-align:top;border-bottom:1px solid var(--paper-line)}
.p-lines td:first-child{text-align:left;padding-left:16px;white-space:pre-line;width:40%}
.p-tot{margin-left:auto;width:410px;margin-top:6px;font-size:14px}
.p-tot div{display:flex;justify-content:space-between;padding:10px 16px}
.p-tot .t-b{font-weight:700}
.p-tot .t-pay{border-top:2.5px solid var(--paper-blue);font-size:20px;font-weight:700;padding-top:12px}
.p-tot .t-pay span:last-child{font-weight:400}
.p-notes{margin-top:30px;font-size:13px;color:var(--paper-muted);white-space:pre-line}
.p-spacer{flex:1;min-height:40px}
.p-pay{font-size:13.5px;border-top:1px solid var(--paper-line);padding-top:8px;line-height:1.7}
.p-pay-t{color:var(--paper-blue);font-weight:700;font-size:14px;margin-bottom:6px}
.p-pay .sp{display:inline-block;width:12px}

@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

const COLS={clientes:'clientes',docs:'docs',trabajos:'trabajos'};

function redondea(n){const r=num(S.aj.redondeo);return r>0?Math.round(n/r)*r:r2(n)}
function totals(d){let neto=0,iva=0,irpf=0;const porIva={};
  for(const l of d.lineas||[]){const b=num(l.c)*num(l.p);neto+=b;const vi=b*num(l.iva)/100;iva+=vi;irpf+=b*num(l.irpf)/100;
    const k=num(l.iva);porIva[k]=(porIva[k]||0)+b}
  return{neto:r2(neto),iva:r2(iva),irpf:r2(irpf),total:r2(neto+iva-irpf),porIva}}
const herr=id=>S.aj.herramientas.find(h=>h.id===id)||S.aj.herramientas[0];
const veg=id=>S.aj.vegetacion.find(v=>v.id===id)||S.aj.vegetacion[0];
const ctipo=id=>S.aj.cercado.tipos.find(t=>t.id===id)||S.aj.cercado.tipos[0];

function compute(){
  const c=S.calc,A=S.aj,ops=Math.max(1,num(c.ops));const desplaz=num(c.km)*2*num(A.kmPrecio);
  let horas=0,coste=0,desg=[],titulo='',desc='',prodTot=0,prodLines=[],hpReal=null,otros=0,matLines=[],matTot=0;
  if(c.modo==='ojo'){
    const o=c.ojo;const hDur=num(o.horas)*(o.unidad==='jornadas'?num(A.jornada):1);const hp=hDur*ops;const mo=hp*num(A.tarifaOperario);
    const ret=num(o.retirada),mat=num(o.material);let maq=0;const maqN=[];
    (o.maqs||[]).forEach(m=>{const M0=A.maquinas.find(x=>x.id===m.id)||(m.nombre?{nombre:m.nombre,tarifa:0}:null);if(!M0)return;const M={...M0,tarifa:(m.tarifa===''||m.tarifa==null)?M0.tarifa:num(m.tarifa)};const h=(m.horas===''||m.horas==null)?hDur:num(m.horas);const e=h*num(M.tarifa);maq+=e;maqN.push(M.nombre.toLowerCase());
      desg.push(`${M.nombre}: ${fx(h)} h × ${fx(M.tarifa)} €/h = ${eur(e)} €`)});
    (o.prods||[]).forEach(p=>{const P=A.productos.find(x=>x.id===p.id);if(!P||!num(p.cant))return;const e=num(p.cant)*num(P.precio);prodTot+=e;
      prodLines.push({d:`${P.nombre} (${P.unidad})`,c:num(p.cant),p:num(P.precio)});desg.push(`${P.nombre}: ${fx(p.cant)} ${P.unidad} × ${eur(P.precio)} € = ${eur(e)} €`)});
    horas=hp;coste=mo+maq+ret+mat;hpReal=hp;otros=maq+ret+mat;
    if(hp)desg.unshift(`Mano de obra: ${fx(hDur)} h × ${ops} operario${ops>1?'s':''} × ${fx(A.tarifaOperario)} €/h = ${eur(mo)} €`);
    if(ret)desg.push(`Retirada de restos: ${eur(ret)} €`);if(mat)desg.push(`Material: ${eur(mat)} €`);
    titulo=o.trabajo||'Trabajo';const V=o.maleza?veg(o.maleza):null;
    desc=(o.desc&&o.desc.trim()?o.desc.trim().split('\n').filter(l=>l.trim()).map(l=>l.trim().startsWith('-')?l.trim():'- '+l.trim()).join('\n')
      :`- ${o.trabajo||'Trabajo'}${num(o.m2)?' de '+fx(o.m2)+' m²':''}${V?' ('+V.nombre.toLowerCase()+')':''}.`)+
      (hp?`\n- Trabajo realizado con ${ops} operario${ops>1?'s':''}${maqN.length?' y '+maqN.join(', '):''}.`:maqN.length?`\n- Con ${maqN.join(', ')}.`:'')+(ret?'\n- Recogida, carga y retirada de restos a vertedero autorizado.':'')+(mat?'\n- Material incluido.':'')+(c.refcat?`\n- Parcela con referencia catastral ${c.refcat}.`:'');
  }else if(c.modo==='desbroce'){
    titulo='Desbroce de parcela';const partes=[];
    c.zonas.forEach((z,i)=>{const H=herr(z.herr),V=veg(z.veg);
      const h=num(z.m2)/1000*num(V.h)*num(H.factor)*num(A.densidad[z.dens]??1)*num(A.altura[z.alt]??1)*num(A.pendiente[z.pend]??1);
      const e=h*num(H.tarifa);horas+=h;coste+=e;
      desg.push(`Zona ${i+1}: ${fx(z.m2)} m² de ${V.nombre.toLowerCase()} · ${fx(h)} h × ${fx(H.tarifa)} €/h = ${eur(e)} €`);
      partes.push(`- Desbroce de ${fx(z.m2)} m² de ${V.nombre.toLowerCase()} con ${H.nombre.toLowerCase()} (densidad ${z.dens.toLowerCase()}, altura ${z.alt}, pendiente ${z.pend.toLowerCase()}).`)});
    desc=partes.join('\n')+(c.refcat?`\n- Parcela con referencia catastral ${c.refcat}.`:'');
  }else if(c.modo==='seto'){
    const s=c.seto,Z=A.seto;const accF=num(Z.acceso[s.acceso]??1);
    const hp=s.tipo==='rebaje'?num(s.m)*num(Z.rebaje)*num(s.rebaje)*accF:num(s.m)*num(Z.recorte)*accF;
    const mo=hp*num(Z.tarifa);const ret=s.retirada?(s.retiradaP==null||s.retiradaP===''?num(Z.retirada):num(s.retiradaP)):0;
    horas=hp;coste=mo+ret;hpReal=hp;otros=ret;
    desg.push(`Mano de obra: ${fx(hp)} h × ${fx(Z.tarifa)} €/h = ${eur(mo)} €`);if(ret)desg.push(`Retirada de restos y vertedero: ${eur(ret)} €`);
    if(s.tipo==='rebaje'){titulo='Rebaje de seto';desc=`- Rebaje de ${fx(s.rebaje)} m de altura en seto de ${fx(s.m)} metros lineales.\n- Trabajo ${s.acceso==='Desde el suelo'?'desde el suelo':'con '+s.acceso.toLowerCase()} con ${ops} operario${ops>1?'s':''}.\n- Remate y redondeado de la parte superior para un acabado uniforme.`}
    else{titulo='Recorte de seto';desc=`- Recorte de mantenimiento de seto de ${fx(s.m)} metros lineales (laterales y parte superior).\n- Trabajo ${s.acceso==='Desde el suelo'?'desde el suelo':'con '+s.acceso.toLowerCase()} con ${ops} operario${ops>1?'s':''}.`}
    if(s.retirada)desc+='\n- Recogida, carga y retirada de restos vegetales a vertedero autorizado.';
  }else{
    const k=c.cerc,Z=A.cercado,T=ctipo(k.tipo);const tf=num(Z.terreno[k.terreno]??1);
    let hp=num(k.m)*num(T.h)*tf;if(k.viejo)hp+=num(k.m)*num(Z.retiradaViejo)*tf;
    if(k.mat){const m=num(k.m),sep=Math.max(0.5,num(T.sep)||3),post=m>0?Math.ceil(m/sep)+1:0;
      (T.receta||[]).forEach(([id,modo,f,mult])=>{const M=(Z.materiales||[]).find(x=>x.id===id);if(!M)return;let q=0;
        if(modo==='postes')q=post*(f||1);else if(modo==='m')q=Math.ceil(m*f);else if(modo==='kg')q=Math.ceil(m*f*2)/2;
        else if(modo==='cada')q=m>0?(Math.ceil(m/f)+1)*(mult||1):0;else if(modo==='fijo')q=f;
        if(q>0){matLines.push({d:M.nombre,c:q,p:num(M.precio),u:M.unidad});matTot+=q*num(M.precio)}})}
    const mo=hp*num(Z.tarifa);const mat=matTot;const port=num(k.portillas)*num(Z.portilla);const dsb=k.desb?num(k.m)*num(Z.desbroceLinea):0;
    horas=hp;coste=mo+mat+port+dsb;hpReal=hp;otros=mat+port+dsb;
    desg.push(`Mano de obra: ${fx(hp)} h × ${fx(Z.tarifa)} €/h = ${eur(mo)} €`);
    matLines.forEach(l=>desg.push(`${l.d}: ${fx(l.c)} ${l.u} × ${eur(l.p)} € = ${eur(l.c*l.p)} €`));
    if(port)desg.push(`Portillas: ${fx(k.portillas)} × ${eur(Z.portilla)} € = ${eur(port)} €`);
    if(dsb)desg.push(`Desbroce de la línea: ${eur(dsb)} €`);
    titulo='Cercado de finca';
    desc=`- Cierre de ${fx(k.m)} metros lineales con ${T.nombre.toLowerCase()}.\n- ${k.mat?'Material incluido.':'Material aportado por el cliente.'}`+
      (num(k.portillas)?`\n- Colocación de ${fx(k.portillas)} portilla${num(k.portillas)>1?'s':''} de acceso.`:'')+
      (k.viejo?'\n- Retirada del cierre antiguo.':'')+(k.desb?'\n- Desbroce previo de la línea de cierre.':'')+
      `\n- Terreno ${k.terreno.toLowerCase()}.`+(c.refcat?`\n- Parcela con referencia catastral ${c.refcat}.`:'');
  }
  if(desplaz>0)desg.push(`Desplazamiento: ${fx(c.km)} km × 2 × ${fx(A.kmPrecio)} €/km = ${eur(desplaz)} €`);
  const bruto=coste+desplaz;let trabajo=bruto>0?redondea(bruto):0;let minimo=false;
  let emp=null;
  if(hpReal!=null&&(hpReal>0||otros>0)){const base=hpReal*num(A.costeOperario)+otros+desplaz;const costeReal=base*(1+num(A.gastosGenerales)/100);
    emp={mo:r2(hpReal*num(A.costeOperario)),otros:r2(otros+desplaz),costeReal:r2(costeReal),
      sin:redondea(costeReal),comp:redondea(costeReal*(1+num(A.beneficioComp)/100)),precio:redondea(costeReal*(1+num(A.beneficio)/100))};
    if(A.modoPrecio==='competitivo')trabajo=emp.comp;else if(A.modoPrecio==='empresa')trabajo=emp.precio}
  if(bruto>0&&trabajo<num(A.minimo)){trabajo=num(A.minimo);minimo=true}
  const precio=r2(trabajo+prodTot);
  const conIva=r2(precio*(1+num(A.iva)/100));
  if(emp){emp.ganas=r2(trabajo-emp.costeReal);emp.prod=prodTot;['sin','comp','precio'].forEach(k=>emp[k]=r2(emp[k]+prodTot))}
  return{horas:r2(horas),dur:r2(horas/ops),ops,bruto:r2(bruto+prodTot),precio,trabajo,prodLines,matLines,matTot:r2(matTot),conIva,minimo,desg,titulo,desc,emp};
}
function sugerirEquipo(serv){const o=S.calc.ojo,A=S.aj;o.trabajo=serv;
  o.maqs=((A.serviciosMaq||{})[serv]||[]).filter(id=>A.maquinas.some(m=>m.id===id)).map(id=>({id,horas:''}));
  o.prods=((A.serviciosProd||{})[serv]||[]).filter(id=>A.productos.some(p=>p.id===id)).map(id=>({id,cant:serv==='Venta de leña'?2:1}))}
function rendimiento(maleza){let m2=0,hp=0,n=0;
  for(const t of S.trabajos){if(t.estado==='hecho'&&t.maleza===maleza&&num(t.m2)>0&&num(t.horasReal)>0){m2+=num(t.m2);hp+=num(t.horasReal)*Math.max(1,num(t.operarios));n++}}
  return n?{mh:r2(m2/hp),n}:null}
function mensajeCliente(R){
  const pl=R.prodLines.map(l=>`\n- ${l.d.replace(/ \(.*\)$/,'')}: ${fx(l.c)} ${(l.d.match(/\((.*)\)$/)||[,''])[1]}`).join('');
  return `Hola, te paso presupuesto del trabajo:\n\n${R.titulo}\n${R.desc}${pl}\n\nPrecio: ${eur0(R.precio)} € + IVA (${eur(R.conIva)} € en total).\n\nSi te parece bien, te digo día y lo hacemos. Un saludo.`;
}
function mensajeDoc(d){const t=totals(d);const E=S.aj.empresa;
  if(d.tipo==='factura')return `Hola, te paso la factura nº ${d.numero} por importe de ${eur(t.total)} €.\n\nPuedes pagarla por transferencia${E.iban?' a la cuenta '+E.iban:''}${d.vence?' antes del '+fmtDate(d.vence):''}.\n\nMuchas gracias. Un saludo.`;

}

    const maqHTML=`<div><div style="${lbl}">Máquinas${(A.serviciosMaq||{})[o.trabajo]?' (ya marcadas las de este servicio)':' (opcional)'}</div><div class="chips">${A.maquinas.map(M=>`<button class="chip ${(o.maqs||[]).some(m=>m.id===M.id)?'on':''}" data-act="maqtog" data-arg="${M.id}" style="display:inline-flex;align-items:center;gap:6px">${M.foto?`<img src="${esc(M.foto)}" alt="" style="width:22px;height:22px;border-radius:5px;object-fit:cover">`:maqIcon(M.nombre,20)}${esc(M.nombre)}${M.modelo?' · '+esc(M.modelo):''}</button>`).join('')}</div></div>
      ${(o.maqs||[]).map((m,i)=>{const M=A.maquinas.find(x=>x.id===m.id)||(m.nombre?{id:'c'+i,nombre:m.nombre,tarifa:0}:null);if(!M)return'';const tf=(m.tarifa===''||m.tarifa==null)?M.tarifa:m.tarifa;
        return `<div class="grid2"><label class="f">Horas de ${esc(M.nombre.toLowerCase())}<input id="o-mq-${i}-h" class="inp num" type="number" inputmode="decimal" min="0" step="0.5" data-k="ojo.maqs.${i}.horas" value="${m.horas??''}" placeholder="Mismas horas"></label><label class="f">Te cuesta (€/h)<input id="o-mq-${i}-t" class="inp num" type="number" inputmode="decimal" min="0" step="any" data-k="ojo.maqs.${i}.tarifa" value="${tf}"></label></div>`}).join('')}
      ${(o.maqs||[]).length?'<p class="muted small" style="margin:0">Si una máquina la tienes por días, pon días × 8 horas.</p>':''}`;
    const prodHTML=`<div><div style="${lbl}">Productos (opcional)</div><div class="chips">${A.productos.map(P=>`<button class="chip ${(o.prods||[]).some(p=>p.id===P.id)?'on':''}" data-act="prodtog" data-arg="${P.id}">${esc(P.nombre)}</button>`).join('')}</div></div>
      ${(o.prods||[]).map((p,i)=>{const P=A.productos.find(x=>x.id===p.id);return P?`<label class="f">${esc(P.nombre)}: cantidad en ${esc(P.unidad)} (${eur(P.precio)} €/${esc(P.unidad)})<input id="o-pr-${P.id}" class="inp num" type="number" inputmode="decimal" min="0" step="any" data-k="ojo.prods.${i}.cant" value="${p.cant??''}"></label>`:''}).join('')}`;
    const dict=`<div class="zone" style="border-style:solid;background:var(--pine-soft);border-color:transparent">
      <h3 style="font-size:19px">Cuéntame la obra</h3>
      <p class="small" style="margin:0">Pulsa el <b>micrófono de tu teclado</b> y di, por ejemplo: «Obra en Lieres, desbroce con 2 operarios 3 días, el dumper me cuesta 150 al día». Luego pulsa Rellenar.</p>
      <textarea id="o-dict" class="inp" rows="3" data-x="dict" placeholder="Habla o escribe aquí…">${esc(S.dict||'')}</textarea>
      <button class="btn pri" data-act="rellenar" id="btn-rellenar">Rellenar</button></div>`;
    modo=(SAMPLE?dict:'')+`<label class="f">Servicio<select id="o-trab" class="inp" data-k="ojo.trabajo">${A.servicios.map(t=>`<option ${o.trabajo===t?'selected':''}>${esc(t)}</option>`).join('')}</select></label>
     <div class="grid2">
      <label class="f">Lo que tardáis<input id="o-horas" class="inp num" type="number" inputmode="decimal" min="0" step="0.5" data-k="ojo.horas" value="${o.horas}"></label>
      <div><div style="font-size:14px;font-weight:600;color:var(--muted);margin-bottom:6px">En</div>
       <div class="seg"><button class="${o.unidad==='horas'?'on':''}" data-act="cset" data-arg="ojo.unidad=horas">Horas</button><button class="${o.unidad==='jornadas'?'on':''}" data-act="cset" data-arg="ojo.unidad=jornadas">Jornadas</button></div></div>
     </div>
     <div class="chips">${(o.unidad==='jornadas'?[0.5,1,2,3,5]:[2,3,4,5,7]).map(v=>`<button class="chip ${num(o.horas)===v?'on':''}" data-act="cset" data-arg="ojo.horas=${v}">${fx(v)} ${o.unidad==='jornadas'?(v===1?'jornada':'jorn.'):'h'}</button>`).join('')}</div>
     ${maqHTML}
     ${prodHTML}
     <div class="grid2">
      <label class="f">Retirada de restos (€)<input id="o-ret" class="inp num" type="number" inputmode="decimal" min="0" data-k="ojo.retirada" value="${o.retirada}"></label>
      <label class="f">Otro material (€)<input id="o-mat" class="inp num" type="number" inputmode="decimal" min="0" data-k="ojo.material" value="${o.material}"></label>
     </div>
     <label class="f">Descripción para el cliente (opcional)<textarea id="o-desc" class="inp" data-k="ojo.desc" rows="3" placeholder="Ej.: Desbroce de finca con desbrozadora de mano">${esc(o.desc)}</textarea></label>
     <details ${o.maleza||num(o.m2)?'open':''}><summary style="cursor:pointer;font-weight:600">Para que la app aprenda (opcional)</summary>
      <div style="display:grid;gap:12px;margin-top:12px">
       <div class="grid2"><label class="f">Maleza<select id="o-mal" class="inp" data-k="ojo.maleza" data-re="1"><option value="">Sin elegir</option>${A.vegetacion.map(v=>`<option value="${v.id}" ${o.maleza===v.id?'selected':''}>${esc(v.nombre)}</option>`).join('')}</select></label>
        <label class="f">m² aproximados<input id="o-m2" class="inp num" type="number" inputmode="decimal" min="0" data-k="ojo.m2" value="${o.m2}"></label></div>
       ${sug}</div></details>`;
  }else if(c.modo==='desbroce'){
    modo=c.zonas.map((z,i)=>`<div class="zone">
     <div class="zone-h"><h3>Zona ${i+1}</h3>${c.zonas.length>1?`<button class="btn sm danger" data-act="zdel" data-arg="${i}">Quitar</button>`:''}</div>
     <div><div class="f" style="font-size:14px;font-weight:600;color:var(--muted);margin-bottom:6px">Herramienta</div>
      <div class="tools">${A.herramientas.map(h=>`<button class="tool ${z.herr===h.id?'on':''}" data-act="cset" data-arg="zonas.${i}.herr=${h.id}"><b>${esc(h.nombre)}</b><span>${fx(h.tarifa)} €/h</span></button>`).join('')}</div></div>
     <label class="f">Tipo de vegetación<select id="z${i}-veg" class="inp" data-k="zonas.${i}.veg">${A.vegetacion.map(v=>`<option value="${v.id}" ${z.veg===v.id?'selected':''}>${esc(v.nombre)} (${fx(v.h*herr(z.herr).factor)} h/1000 m²)</option>`).join('')}</select></label>
     <label class="f">Superficie (m²)<input id="z${i}-m2" class="inp num" type="number" inputmode="decimal" min="0" data-k="zonas.${i}.m2" value="${z.m2}"></label>
     <div class="chips">${[100,250,500,1000,2000,5000].map(v=>`<button class="chip ${num(z.m2)===v?'on':''}" data-act="cset" data-arg="zonas.${i}.m2=${v}">${v.toLocaleString('es-ES')}</button>`).join('')}</div>
     <div><div style="font-size:14px;font-weight:600;color:var(--muted);margin-bottom:6px">Densidad</div>
      <div class="seg">${Object.keys(A.densidad).map(k=>`<button class="${z.dens===k?'on':''}" data-act="cset" data-arg="zonas.${i}.dens=${k}">${esc(k)}</button>`).join('')}</div></div>
     <div class="grid2">
      <label class="f">Altura<select id="z${i}-alt" class="inp" data-k="zonas.${i}.alt">${Object.keys(A.altura).map(k=>`<option ${z.alt===k?'selected':''}>${esc(k)}</option>`).join('')}</select></label>
      <label class="f">Pendiente<select id="z${i}-pend" class="inp" data-k="zonas.${i}.pend">${Object.keys(A.pendiente).map(k=>`<option ${z.pend===k?'selected':''}>${esc(k)}</option>`).join('')}</select></label>
     </div></div>`).join('')+`<button class="btn" data-act="zadd">${svg('plus')}Añadir otra zona</button>`;
  }else if(c.modo==='seto'){
    const s=c.seto;
    modo=`<div class="seg"><button class="${s.tipo==='rebaje'?'on':''}" data-act="cset" data-arg="seto.tipo=rebaje">Rebajar altura</button><button class="${s.tipo==='recorte'?'on':''}" data-act="cset" data-arg="seto.tipo=recorte">Recorte normal</button></div>
     <div class="grid2">
      <label class="f">Metros de largo<input id="s-m" class="inp num" type="number" inputmode="decimal" min="0" data-k="seto.m" value="${s.m}"></label>
      ${s.tipo==='rebaje'?`<label class="f">Metros a rebajar<input id="s-reb" class="inp num" type="number" inputmode="decimal" min="0" step="0.1" data-k="seto.rebaje" value="${s.rebaje}"></label>`:'<div></div>'}
     </div>
     <div><div style="font-size:14px;font-weight:600;color:var(--muted);margin-bottom:6px">Cómo se trabaja</div>
      <div class="seg">${Object.keys(A.seto.acceso).map(k=>`<button class="${s.acceso===k?'on':''}" data-act="cset" data-arg="seto.acceso=${k}">${esc(k)}</button>`).join('')}</div></div>
     <label class="check"><input id="s-ret" type="checkbox" data-k="seto.retirada" ${s.retirada?'checked':''}>Con retirada de restos</label>
     ${s.retirada?`<label class="f">Precio de la retirada (€)<input id="s-retp" class="inp num" type="number" inputmode="decimal" min="0" data-k="seto.retiradaP" value="${s.retiradaP==null?A.seto.retirada:s.retiradaP}"></label>`:''}`;
  }else{
    const k=c.cerc;
    modo=`<label class="f">Tipo de cierre<select id="k-tipo" class="inp" data-k="cerc.tipo">${A.cercado.tipos.map(t=>`<option value="${t.id}" ${k.tipo===t.id?'selected':''}>${esc(t.nombre)}</option>`).join('')}</select></label>
     <div class="grid2">
      <label class="f">Metros de cierre<input id="k-m" class="inp num" type="number" inputmode="decimal" min="0" data-k="cerc.m" value="${k.m}"></label>

     </div>
     <div class="chips">${[50,100,200,500,1000].map(v=>`<button class="chip ${num(k.m)===v?'on':''}" data-act="cset" data-arg="cerc.m=${v}">${v} m</button>`).join('')}</div>
     <div><div style="font-size:14px;font-weight:600;color:var(--muted);margin-bottom:6px">Terreno</div>
      <div class="seg">${Object.keys(A.cercado.terreno).map(t=>`<button class="${k.terreno===t?'on':''}" data-act="cset" data-arg="cerc.terreno=${t}">${esc(t)}</button>`).join('')}</div></div>
     <label class="check"><input id="k-mat" type="checkbox" data-k="cerc.mat" ${k.mat?'checked':''}>Material incluido</label>
     <label class="check"><input id="k-viejo" type="checkbox" data-k="cerc.viejo" ${k.viejo?'checked':''}>Quitar el cierre viejo</label>

  }
  return `${statusNote()}<div class="sec-title"><h1>Calcular</h1></div>
   <div class="seg" role="tablist">${[['ojo','A ojo'],['desbroce','Desbroce'],['seto','Setos'],['cercado','Cercados']].map(([k,t])=>`<button class="${c.modo===k?'on':''}" data-act="cset" data-arg="modo=${k}">${t}</button>`).join('')}</div>
   ${comun}
   <section class="card">${modo}
    <div class="grid2">
     <label class="f">Operarios<select id="c-ops" class="inp" data-k="ops">${[1,2,3,4,5].map(n=>`<option value="${n}" ${num(c.ops)===n?'selected':''}>${n} operario${n>1?'s':''}</option>`).join('')}</select></label>
     <label class="f">Km hasta la obra (ida)<input id="c-km" class="inp num" type="number" inputmode="decimal" min="0" data-k="km" value="${c.km}"></label>
    </div>
   </section>
   <section class="result" id="res" aria-live="polite"></section>`;
},
documentos(){
  const tab=S.docTab;const q=S.buscar.toLowerCase();
  const list=sortDocs(S.docs.filter(d=>d.tipo===tab&&(!q||docCli(d).toLowerCase().includes(q)||String(d.numero||'').toLowerCase().includes(q))));
  return `${statusNote()}<div class="sec-title"><h1>Documentos</h1><button class="btn sm pri" data-act="newdoc" data-arg="${tab}">${svg('plus')}${tab==='factura'?'Nueva factura':'Nuevo presupuesto'}</button></div>
   <div class="seg"><button class="${tab==='presupuesto'?'on':''}" data-act="gotab" data-arg="presupuesto">Presupuestos</button><button class="${tab==='factura'?'on':''}" data-act="gotab" data-arg="factura">Facturas</button></div>
   <input id="buscar-doc" class="inp" data-s="1" placeholder="Buscar por cliente o número" value="${esc(S.buscar)}">
   ${list.length?`<div class="list">${list.map(docItem).join('')}</div>`:`<div class="empty">${q?'No hay resultados.':tab==='factura'?'Aún no hay facturas. Puedes hacer una nueva o pasar un presupuesto aceptado a factura.':'Aún no hay presupuestos. Hazlo desde «Calcular» o con «Nuevo presupuesto».'}</div>`}`;
},
clientes(){
  const q=S.buscar.toLowerCase();
  const list=S.clientes.filter(c=>!q||(c.nombre||'').toLowerCase().includes(q)||(c.cp||'').toLowerCase().includes(q)).sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||''));
  return `${statusNote()}<div class="sec-title"><h1>Clientes</h1><button class="btn sm pri" data-act="cliedit" data-arg="">${svg('plus')}Nuevo cliente</button></div>
   <input id="buscar-cli" class="inp" data-s="1" placeholder="Buscar cliente o pueblo" value="${esc(S.buscar)}">
   ${list.length?`<div class="list">${list.map(c=>{const n=S.docs.filter(d=>d.clienteId===c.id).length;
     return `<button class="item" data-act="cliedit" data-arg="${c.id}"><div class="main"><b>${esc(c.nombre)}</b><span>${esc([c.cp,c.telefono].filter(Boolean).join(' · ')||'Sin datos de contacto')}</span></div><div class="side"><span class="muted small">${n} doc.</span></div></button>`}).join('')}</div>`
   :`<div class="empty">${q?'No hay resultados.':'Aún no tienes clientes guardados.'}</div>`}`;
},
trabajos(){
  const f=S.trabFiltro;
  const list=S.trabajos.filter(t=>f==='todos'||(f==='activos'?t.estado!=='hecho':t.estado==='hecho')).sort((a,b)=>f==='hechos'?(b.fecha||'').localeCompare(a.fecha||''):(a.fecha||'9').localeCompare(b.fecha||'9'));
  return `${statusNote()}<div class="sec-title"><h1>Trabajos</h1><button class="btn sm pri" data-act="trabedit" data-arg="">${svg('plus')}Nuevo trabajo</button></div>
   <div class="seg">${[['activos','Por hacer'],['hechos','Hechos'],['todos','Todos']].map(([k,t])=>`<button class="${f===k?'on':''}" data-act="tfil" data-arg="${k}">${t}</button>`).join('')}</div>
   ${list.length?`<div class="list">${list.map(trabItem).join('')}</div>`:`<div class="empty">No hay trabajos aquí.</div>`}`;
},
ajustes(){

   <div class="grid2">${inp('IVA (%)','iva','number')}${inp('Redondear a (€)','redondeo','number')}</div>
   <div class="grid2">${inp('Desplazamiento (€/km)','kmPrecio','number')}${inp('Precio mínimo (€)','minimo','number')}</div>

  </section>
  <section class="card"><h2>Seguridad</h2>

   <div class="grid2">${inp('Beneficio competitivo (%)','beneficioComp','number')}${inp('Beneficio de empresa (%)','beneficio','number')}</div>
   <label class="f">Precio que sale por defecto<select id="a-modo" class="inp" data-a="modoPrecio">${[['competitivo','Competitivo (para ganar clientes)'],['empresa','Precio de empresa'],['tarifas','Por mis tarifas por hora']].map(([k,t])=>`<option value="${k}" ${A.modoPrecio===k?'selected':''}>${t}</option>`).join('')}</select></label>
   <label class="f">Desde dónde sales (para los km)<select id="a-base" class="inp" data-a="base">${LUGARES.map(l=>`<option ${A.base===l.n?'selected':''}>${esc(l.n)}</option>`).join('')}</select></label>
   <p class="muted small" style="margin:0">Gastos generales: seguros, gestoría, furgonetas, gasoil, reparaciones, móvil…</p>
  </section>
  <section class="card"><h2>Mis servicios</h2>
   ${A.servicios.map((s,i)=>`<div style="display:flex;gap:8px;align-items:end"><label class="f" style="flex:1">Servicio<input id="a-sv${i}" class="inp" data-a="servicios.${i}" value="${esc(s)}"></label><button class="btn sm danger" data-act="ajdel" data-arg="servicios:${i}" aria-label="Quitar">${svg('x')}</button></div>`).join('')}
   <button class="btn sm" data-act="ajadd" data-arg="servicios">${svg('plus')}Añadir servicio</button>
  </section>
  <section class="card"><h2>Mi maquinaria</h2>
   <p class="muted small" style="margin:0">Pon lo que gasta cada máquina en un día de ${fx(A.jornada)} h. «Otros gastos»: alquiler, mantenimiento, cuchillas, cadena, seguro… La app saca el €/hora sola.</p>
   ${A.maquinas.map((m,i)=>`<div class="line-ed">
     <div style="display:flex;gap:10px;align-items:center">
      ${m.foto?`<img src="${esc(m.foto)}" alt="Foto de ${esc(m.nombre)}" style="width:72px;height:72px;object-fit:cover;border-radius:10px;flex:none">`:`<div style="width:72px;height:72px;border-radius:10px;background:var(--pine-soft);display:grid;place-items:center;color:var(--pine);flex:none">${maqIcon(m.nombre,46)}</div>`}
      <label class="btn sm" style="cursor:pointer" id="a-mq${i}-fl">${m.foto?'Cambiar foto':'Añadir foto'}<input type="file" accept="image/*" hidden data-foto="${i}"></label>
     </div>
     <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end">
      <label class="f">Máquina<input id="a-mq${i}-n" class="inp" data-a="maquinas.${i}.nombre" value="${esc(m.nombre)}"></label>
      <label class="f">Modelo<input id="a-mq${i}-m" class="inp" data-a="maquinas.${i}.modelo" value="${esc(m.modelo||'')}" placeholder="Ej.: Husqvarna 545RX"></label>
      <button class="btn sm danger" data-act="ajdel" data-arg="maquinas:${i}" aria-label="Quitar">${svg('x')}</button></div>
     <div class="grid3">
      <label class="f">Gasoil / día (€)<input id="a-mq${i}-g" class="inp num" type="number" inputmode="decimal" step="any" min="0" data-a="maquinas.${i}.gasoilDia" value="${m.gasoilDia||0}"></label>

function applyFijo(R){const pt=R.precio-R.trabajo;R.precio=r2(S.precioFijo);R.trabajo=r2(S.precioFijo-pt);R.conIva=r2(R.precio*(1+num(S.aj.iva)/100));if(R.emp)R.emp.ganas=r2(R.trabajo-R.emp.costeReal)}
function lugHint(){const L=findLugar(S.calc.lugar);return L?`≈ ${kmDesde(L)} km desde ${esc(S.aj.base)} (aprox., por carretera)`:(S.calc.lugar?'No lo encuentro: pon los km a mano':'')}
function updateResult(){
  const el=$('#res');if(!el)return;const R=compute();
  if(S.precioFijo!=null){if(S.precioFijo<=0)S.precioFijo=null;else applyFijo(R)}
  el.innerHTML=`<div><div class="sub">${S.precioFijo!=null?'Precio elegido':S.aj.modoPrecio==='competitivo'&&R.emp?'Precio competitivo':S.aj.modoPrecio==='empresa'&&R.emp?'Precio de empresa':'Precio estimado'}</div><div class="big num">${eur0(R.precio)} € <span style="font-size:22px">+ IVA</span></div><div class="sub num">${eur(R.conIva)} € con IVA${R.minimo?' · precio mínimo aplicado':''}</div></div>
   <div class="kv"><div><small>Horas de trabajo</small><b class="num">${fx(R.horas)} h</b></div><div><small>Con ${R.ops} operario${R.ops>1?'s':''}</small><b class="num">≈ ${fx(R.dur)} h</b></div></div>
   <ul>${R.desg.map(d=>`<li>${esc(d)}</li>`).join('')}<li>Total sin redondear: ${eur(R.bruto)} €</li></ul>
   ${R.emp?(()=>{const E=R.emp,A=S.aj;const pierde=E.ganas<0;
     const opt=(k,t,sub)=>`<button class="item" style="padding:10px 12px" data-act="usarempresa" data-arg="${E[k]}"><div class="main"><b>${t}</b><span>${sub}</span></div><div class="side"><b class="num">${eur0(E[k])} €</b>${Math.abs(R.precio-E[k])<0.01?'<span class="pill p-ok">Elegido</span>':''}</div></button>`;
     return `<div style="background:var(--surface);color:var(--ink);border-radius:12px;padding:14px;display:grid;gap:8px">
      <div class="tag">Con números de empresa (sin IVA)</div>
      ${opt('sin','Sin ganar nada','Solo cubre costes')}
      ${opt('comp','Competitivo',`+${fx(A.beneficioComp)} % · para ganar clientes`)}
      ${opt('precio','Precio de empresa',`+${fx(A.beneficio)} % de beneficio`)}
      <div class="small muted">Coste real ${eur(E.costeReal)} €: operarios a ${fx(A.costeOperario)} €/h (${eur(E.mo)} €), máquinas, material y desplazamiento (${eur(E.otros)} €) y ${fx(A.gastosGenerales)} % de gastos generales${E.prod?`. Productos aparte: ${eur(E.prod)} €`:''}.</div>
      <div class="pill ${pierde?'p-bad':E.ganas<E.costeReal*0.05?'p-pend':'p-ok'}" style="justify-self:start;font-size:14px;padding:6px 12px">${pierde?`Con este precio pierdes ${eur(-E.ganas)} €`:`Con este precio ganas ${eur(E.ganas)} €`}</div>
     </div>`})():''}
   <div class="row"><button class="btn" data-act="calc2doc">${svg('doc')}Crear presupuesto</button><button class="btn ghost" data-act="calccopy">${svg('copy')}Copiar mensaje</button></div>`;
  const ref=(S.calc.refcat||'').replace(/\s/g,'');const lc=$('#lnk-cat'),lm=$('#lnk-map');
  if(lc)lc.href=ref.length>=14?'https://www1.sedecatastro.gob.es/Cartografia/mapa.aspx?refcat='+encodeURIComponent(ref):'https://www1.sedecatastro.gob.es/';
  if(lm)lm.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(S.calc.lugar||'Asturias');
}

function openSheet(title,body,type,id){

}

function iniciarDueño(){
  let started=false;ocultarNav(true);$('#app').innerHTML='<div class="empty">Abriendo…</div>';
  firebase.auth().onAuthStateChanged(async u=>{
    if(!u){try{await firebase.auth().signInAnonymously()}catch(e){console.error(e);$('#app').innerHTML='<div class="notice">No se puede conectar. Revisa internet y vuelve a abrir la app.</div>'}return}
    const ref=fdb.doc('config/dueno');let snap;
    try{snap=await ref.get()}catch(e){console.error(e);$('#app').innerHTML='<div class="notice">No se puede conectar con la base de datos. Revisa internet.</div>';return}
    let primera=false;
    if(!snap.exists){try{await ref.set({uids:[u.uid],creado:Date.now()});primera=true}catch(e){console.error(e);noAutorizado(u.uid);return}}
    else if(!(snap.data().uids||[]).includes(u.uid)){noAutorizado(u.uid);return}
    let preguntado=false;try{preguntado=!!localStorage.getItem('jr-huella-preguntado')}catch(e){}
    if(hGet()&&!desbloqueado){pantallaHuella(arrancar);return}
    if(!hGet()&&!preguntado&&await huellaDisponible()){try{localStorage.setItem('jr-huella-preguntado','1')}catch(e){}ofrecerHuella(arrancar);return}
    ocultarNav(false);arrancar();
  });
  function arrancar(){
    if(started){render();return}started=true;db=fdb;S.dbOk=true;render();
    const got=new Set();const timer=setTimeout(()=>{if(!S.loaded){S.slow=true;render()}},10000);
    const done=(k,snap)=>{if(!snap.metadata.fromCache)got.add(k);if(got.size>=4&&!S.loaded){S.loaded=true;S.slow=false;clearTimeout(timer)}};
    const err=e=>{console.error(e);clearTimeout(timer);S.loaded=true;S.slow=false;S.dbOk=false;render()};
    db.doc('ajustes/general').onSnapshot(s=>{S.aj=merge(clone(DEF),s.exists?clone(s.data()):{});S.aj.cercado.tipos.forEach(t=>{const d=DEF.cercado.tipos.find(x=>x.id===t.id);if(d){if(!t.receta)t.receta=clone(d.receta);if(!t.sep)t.sep=d.sep}});
      if(!s.exists&&!s.metadata.fromCache){db.doc('ajustes/general').set(JSON.parse(JSON.stringify(S.aj))).catch(console.error)}
      done('aj',s);if(S.view!=='ajustes'||!S.loaded)render()},err);
    db.collection('clientes').onSnapshot(q=>{S.clientes=q.docs.map(d=>({id:d.id,...d.data()}));done('cli',q);render()},err);
    db.collection('docs').onSnapshot(q=>{S.docs=q.docs.map(d=>({id:d.id,...d.data()}));done('docs',q);render()},err);
    db.collection('trabajos').onSnapshot(q=>{S.trabajos=q.docs.map(d=>({id:d.id,...d.data()}));done('tr',q);render()},err);
    db.collection('firmas').where('estado','==','aceptado').onSnapshot(q=>{q.docs.forEach(f=>{const F=f.data();const d=S.docs.find(x=>x.id===F.docId);
      if(d&&!d.firma){db.collection('docs').doc(d.id).set({...strip(d),estado:'aceptado',firma:F.firma,firmadoPor:F.firmadoPor||'',firmadoEn:F.firmadoEn||Date.now()}).then(()=>toast(`¡${F.firmadoPor||'El cliente'} ha firmado el presupuesto ${d.numero}!`)).catch(console.error)}})},e=>console.error(e));
  }

async function paginaFirma(token){
  document.querySelector('.bottom').hidden=true;document.querySelector('.top .icon-btn').hidden=true;
  $('#app').innerHTML='<div class="empty">Cargando presupuesto…</div>';
  let snap;try{snap=await fdb.collection('firmas').doc(token).get()}catch(e){snap=null}
  if(!snap||!snap.exists){$('#app').innerHTML='<div class="empty">Este enlace no existe o ya no está disponible.</div>';return}
  const F=snap.data();S.aj.empresa={...S.aj.empresa,...F.empresa};
  const d={...F.doc,firma:F.firma,firmadoPor:F.firmadoPor,firmadoEn:F.firmadoEn};const t=totals(d);
  const firmado=F.estado==='aceptado';
  $('#app').innerHTML=`<section class="card"><span class="tag">Presupuesto ${esc(d.numero||'')}</span><h2>${esc(F.empresa.nombre)}</h2>
     <div style="font-size:28px;font-family:var(--f-display);font-weight:700" class="num">${eur(t.total)} € <span style="font-size:16px;font-weight:600">IVA incluido</span></div>
     ${firmado?`<div class="notice" style="background:var(--ok-soft);color:var(--ok)">Presupuesto aceptado. ¡Gracias! Nos pondremos en contacto contigo.</div>`:''}</section>
   <div class="paper-box" id="pbox">${paperHTML(d)}</div>
   ${firmado?'':`<section class="card" id="firma-card"><h2>Aceptar el presupuesto</h2>
     <label class="f">Tu nombre y apellidos<input id="fz-nombre" class="inp" autocomplete="name"></label>
     <div><div style="font-size:14px;font-weight:600;color:var(--muted);margin-bottom:6px">Firma aquí con el dedo</div>
      <canvas id="fz-canvas" style="width:100%;height:180px;background:#fff;border:1.5px dashed var(--line);border-radius:12px;touch-action:none;display:block"></canvas>
      <button class="btn sm" id="fz-borrar" style="margin-top:8px">Borrar firma</button></div>
     <label class="check"><input id="fz-ok" type="checkbox">He leído el presupuesto y acepto el precio y las condiciones.</label>
     <button class="btn pri" id="fz-enviar">Aceptar y firmar</button></section>`}`;
  fitPaper();if(firmado)return;
  const cv=$('#fz-canvas');const r=cv.getBoundingClientRect();const k=window.devicePixelRatio||1;cv.width=r.width*k;cv.height=r.height*k;
  const ctx=cv.getContext('2d');ctx.scale(k,k);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#14213d';
  let dib=false,trazos=0,last=null;const pos=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  cv.onpointerdown=e=>{dib=true;last=pos(e);cv.setPointerCapture(e.pointerId)};
  cv.onpointermove=e=>{if(!dib)return;const p=pos(e);ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();last=p;trazos++};
  cv.onpointerup=cv.onpointercancel=()=>{dib=false};
  $('#fz-borrar').onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);trazos=0};
  $('#fz-enviar').onclick=async()=>{const nombre=$('#fz-nombre').value.trim();
    if(!nombre){toast('Escribe tu nombre.');return}if(trazos<5){toast('Firma en el recuadro blanco.');return}if(!$('#fz-ok').checked){toast('Marca la casilla para aceptar.');return}
    const out=document.createElement('canvas');out.width=440;out.height=Math.round(440*cv.height/cv.width);const o=out.getContext('2d');o.fillStyle='#fff';o.fillRect(0,0,out.width,out.height);o.drawImage(cv,0,0,out.width,out.height);

    catch(e){console.error(e);b.disabled=false;b.textContent='Aceptar y firmar';toast('No se ha podido enviar. Inténtalo de nuevo.')}};
}
