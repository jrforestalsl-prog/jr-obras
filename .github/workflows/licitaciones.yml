name: Licitaciones
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/licitaciones.py
      - run: |
          git config user.name "jr-obras-bot"
          git config user.email "actions@users.noreply.github.com"
          git add licitaciones.json
          git commit -m "Licitaciones del día" || exit 0
          git push
